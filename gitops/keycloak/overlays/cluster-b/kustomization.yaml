apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
patches:
  - target:
      kind: Keycloak
      name: keycloak
    patch: |-
      - op: replace
        path: /spec/additionalOptions/0/value
        value: keycloak-b
  - target:
      kind: Service
      name: keycloak-external
    patch: |-
      - op: replace
        path: /metadata/annotations/metallb.io~1loadBalancerIPs
        value: REPLACE_ME_CLUSTER_B_METALLB_IPV6
