apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: keycloak
resources:
  - certificate.yaml
  - external-secrets.yaml
configMapGenerator:
  - name: keycloak-db-rootcert
    files:
      - db-ca.pem
# Keycloak references a stable name; trust rotation is reviewed in Git.
generatorOptions:
  disableNameSuffixHash: true
