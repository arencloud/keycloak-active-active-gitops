apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: keycloak-automation
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: REPLACE_ME_CLUSTER_SECRET_STORE
    kind: ClusterSecretStore
  target:
    name: keycloak-automation
    creationPolicy: Owner
  data:
    - secretKey: opnsense_url
      remoteRef:
        key: REPLACE_ME_OPNSENSE_VAULT_PATH
        property: opnsense_url
    - secretKey: opnsense_key
      remoteRef:
        key: REPLACE_ME_OPNSENSE_VAULT_PATH
        property: opnsense_key
    - secretKey: opnsense_secret
      remoteRef:
        key: REPLACE_ME_OPNSENSE_VAULT_PATH
        property: opnsense_secret
    - secretKey: cloudflare_token
      remoteRef:
        key: REPLACE_ME_CLOUDFLARE_VAULT_PATH
        property: api-token
    - secretKey: keycloak_ca
      remoteRef:
        key: REPLACE_ME_AUTOMATION_VAULT_PATH
        property: keycloak_ca
    - secretKey: opnsense_ca
      remoteRef:
        key: REPLACE_ME_AUTOMATION_VAULT_PATH
        property: opnsense_ca
    - secretKey: permanent_admin_username
      remoteRef:
        key: REPLACE_ME_AUTOMATION_VAULT_PATH
        property: permanent_admin_username
    - secretKey: permanent_admin_password
      remoteRef:
        key: REPLACE_ME_AUTOMATION_VAULT_PATH
        property: permanent_admin_password
    - secretKey: smoke_client_secret
      remoteRef:
        key: REPLACE_ME_AUTOMATION_VAULT_PATH
        property: smoke_client_secret
