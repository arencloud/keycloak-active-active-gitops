apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: keycloak-db
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: REPLACE_ME_CLUSTER_SECRET_STORE
    kind: ClusterSecretStore
  target:
    name: keycloak-db
    creationPolicy: Owner
  data:
    - secretKey: host
      remoteRef:
        key: REPLACE_ME_DATABASE_VAULT_PATH
        property: host
    - secretKey: database
      remoteRef:
        key: REPLACE_ME_DATABASE_VAULT_PATH
        property: database
    - secretKey: username
      remoteRef:
        key: REPLACE_ME_DATABASE_VAULT_PATH
        property: username
    - secretKey: password
      remoteRef:
        key: REPLACE_ME_DATABASE_VAULT_PATH
        property: password
---
