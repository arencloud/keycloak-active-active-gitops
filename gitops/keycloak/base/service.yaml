apiVersion: v1
kind: Service
metadata:
  name: keycloak-external
  annotations:
    metallb.io/address-pool: machine-network-last-50
    metallb.io/loadBalancerIPs: REPLACE_ME_METALLB_IPV6
spec:
  type: LoadBalancer
  ipFamilyPolicy: SingleStack
  ipFamilies: [IPv6]
  externalTrafficPolicy: Local
  selector:
    app: keycloak
    app.kubernetes.io/instance: keycloak
    app.kubernetes.io/managed-by: keycloak-operator
  ports:
    - name: https
      port: 443
      targetPort: 8443
      protocol: TCP
