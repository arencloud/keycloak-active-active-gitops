<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="352" viewBox="0 0 1280 352" role="img" aria-labelledby="title desc">
<title id="title">Active/Active Keycloak</title><desc id="desc">Community Keycloak 26.8.1 on OpenShift 4.22.x. One public IPv6 endpoint, two active sites and shared PostgreSQL. Deployment uses AAP, ACM and GitOps.</desc>
<style>text{font-family:Arial,Helvetica,sans-serif}</style>
