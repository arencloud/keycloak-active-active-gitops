10V256 M1135 214V237H1010" fill="none" stroke="#4dbcb4" stroke-width="2"/><rect x="865" y="44" width="290" height="59" rx="12" fill="#143346" stroke="#3f7180"/><rect x="797" y="150" width="176" height="64" rx="12" fill="#143346" stroke="#3f7180"/><rect x="1047" y="150" width="176" height="64" rx="12" fill="#143346" stroke="#3f7180"/><rect x="865" y="256" width="290" height="58" rx="12" fill="#143346" stroke="#3f7180"/><text x="1010" y="70" font-size="14" fill="#edfcff" font-weight="700" text-anchor="middle">ONE PUBLIC ENDPOINT</text><text x="1010" y="90" font-size="12" fill="#a1c6d1" font-weight="400" text-anchor="middle">HTTPS over IPv6</text><text x="885" y="178" font-size="14" fill="#edfcff" font-weight="700" text-anchor="middle">SITE A</text><text x="885" y="198" font-size="12" fill="#a1c6d1" font-weight="400" text-anchor="middle">Keycloak</text><text x="1135" y="178" font-size="14" fill="#edfcff" font-weight="700" text-anchor="middle">SITE B</text><text x="1135" y="198" font-size="12" fill="#a1c6d1" font-weight="400" text-anchor="middle">Keycloak</text><text x="1010" y="282" font-size="14" fill="#edfcff" font-weight="700" text-anchor="middle">SHARED POSTGRESQL</text><text x="1010" y="302" font-size="12" fill="#a1c6d1" font-weight="400" text-anchor="middle">Persistent identity and sessions</text>
