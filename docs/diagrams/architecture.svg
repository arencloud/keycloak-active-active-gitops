<text x="480" y="400" class="heading" text-anchor="middle">02 · OPNsense / HAProxy</text>
<text x="480" y="430" class="body" text-anchor="middle">Public VIP  [PUBLIC_IPV6_VIP]:443</text>
<text x="480" y="458" class="body" text-anchor="middle">TLS termination · round-robin across healthy sites</text>
