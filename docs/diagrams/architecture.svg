<text x="524" y="206" class="heading" text-anchor="start">01 · Resolve with Cloudflare DNS</text>
<text x="524" y="236" class="body" text-anchor="start">DNS-only AAAA → public IPv6 VIP</text>
<text x="524" y="262" class="small" text-anchor="start">Through the client’s recursive resolver</text>
