<text x="40" y="83" class="body white" text-anchor="start">Keycloak 26.8.1  /  OpenShift 4.22.x  /  IPv6 runtime traffic</text>
<text x="1238" y="47" class="eyebrow white" text-anchor="end">TARGET ARCHITECTURE</text>
<text x="40" y="149" class="body" text-anchor="start">CLIENT ACCESS</text>
<text x="960" y="149" class="eyebrow" text-anchor="start">DEPLOYMENT &amp; TRUST</text>
<rect x="40" y="170" width="420" height="116" rx="16" fill="white" stroke="#d6e1ef" stroke-width="1.5"/>
<text x="64" y="206" class="heading" text-anchor="start">Browser / application</text>
<text x="64" y="236" class="body" text-anchor="start">auth.example.com</text>
<text x="64" y="262" class="small" text-anchor="start">IPv6 connectivity + trusted Vault CA</text>
