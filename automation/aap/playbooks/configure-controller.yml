---
- name: Register the self-service workflow without launching it
  hosts: localhost
  connection: local
  gather_facts: false
  module_defaults:
    ansible.builtin.uri:
      ca_path: '{{ controller_ca_file | default(omit) }}'
      validate_certs: true
      follow_redirects: none
  vars:
    configure_controller: false
    controller_report_directory: ''
    workflow_name: Keycloak Active Active Self Service
    survey_file: '{{ playbook_dir }}/../controller/survey.json'
    workflow_description: Select two ACM clusters, namespace, public endpoint, a Vault database secret and database TLS mode. Discover, plan and deploy through Git-gated automation.
    controller_refresh_cluster_choices: true
    controller_nodes:
      - {identifier: preflight, template_name: Keycloak ACM Preflight}
      - {identifier: plan, template_name: Keycloak Release Plan}
      - {identifier: execute, template_name: Keycloak Release Execute}
    controller_jobs:
      - name: Keycloak ACM Preflight
        playbook: automation/aap/playbooks/automatic-release.yml
        extra_vars: {automatic_mode: discover}
        credential_ids: '{{ controller_preflight_credential_ids }}'
      - name: Keycloak Release Plan
        playbook: automation/aap/playbooks/automatic-release.yml
        extra_vars: {automatic_mode: plan}
        credential_ids: '{{ controller_preflight_credential_ids }}'
      - name: Keycloak Release Execute
        playbook: automation/aap/playbooks/automatic-release.yml
        extra_vars: {automatic_mode: deploy, keycloak_report_directory: '{{ controller_report_directory }}'}
        credential_ids: '{{ controller_deploy_credential_ids }}'
  tasks:
    - name: Require explicit controller configuration and existing AAP objects
      ansible.builtin.assert:
        that:
          - configure_controller | bool
          - controller_api_base is match('^https://')
          - controller_organization_id | int > 0
          - controller_project_id | int > 0
          - controller_inventory_id | int > 0
          - controller_execution_environment_id | int > 0
          - controller_preflight_credential_ids | length > 0
          - controller_deploy_credential_ids | length > 0
          - lookup('ansible.builtin.env', 'CONTROLLER_OAUTH_TOKEN') | length > 0
        fail_msg: Supply reviewed AAP object IDs, an injected controller token, and configure_controller=true. This playbook never launches jobs.

    - name: Reconcile the three job templates
      ansible.builtin.include_tasks: tasks/controller-job.yml
      loop: '{{ controller_jobs }}'
      loop_control:
        loop_var: job_definition

    - name: Find the workflow template
      ansible.builtin.uri:
        url: '{{ controller_api_base }}/workflow_job_templates/?name={{ workflow_name | urlencode }}&organization={{ controller_organization_id }}'
        headers: {Authorization: "Bearer {{ lookup('ansible.builtin.env', 'CONTROLLER_OAUTH_TOKEN') }}"}
        return_content: true
      register: workflow_lookup
      no_log: true

    - name: Require an unambiguous workflow name
      ansible.builtin.assert:
        that: workflow_lookup.json.count | int <= 1

    - name: Create or update the manual-launch workflow
      ansible.builtin.uri:
        url: "{{ controller_api_base }}/workflow_job_templates/{{ (workflow_lookup.json.results[0].id | string + '/') if workflow_lookup.json.count | int == 1 else '' }}"
        method: "{{ 'PATCH' if workflow_lookup.json.count | int == 1 else 'POST' }}"
        headers: {Authorization: "Bearer {{ lookup('ansible.builtin.env', 'CONTROLLER_OAUTH_TOKEN') }}"}
        body_format: json
        body:
          name: '{{ workflow_name }}'
          organization: '{{ controller_organization_id | int }}'
          description: '{{ workflow_description }}'
          allow_simultaneous: false
          survey_enabled: true
          ask_variables_on_launch: false
        status_code: [200, 201]
      register: workflow_saved
      no_log: true

    - name: Read the survey definition
      ansible.builtin.set_fact:
        effective_survey: "{{ lookup('ansible.builtin.file', survey_file) | from_json }}"

    - name: Refresh deployment choices from the ACM hub
      when: workflow_name == 'Keycloak Active Active Self Service' and controller_refresh_cluster_choices | bool
      block:
        - name: Discover joined and available managed clusters
          ansible.builtin.command:
            argv: [python3, '{{ playbook_dir }}/../../../scripts/survey_choices.py']
          register: discovered_choices
          changed_when: false

        - name: Require a selectable cluster pair
          ansible.builtin.assert:
            that: discovered_choices.stdout | from_json | length >= 2

        - name: Replace both cluster choice lists without preselecting a pair
          ansible.builtin.set_fact:
            effective_survey: "{{ effective_survey | combine({'spec': [effective_survey.spec[0] | combine({'choices': (discovered_choices.stdout | from_json | join('\n'))}), effective_survey.spec[1] | combine({'choices': (discovered_choices.stdout | from_json | join('\n'))})] + effective_survey.spec[2:]}) }}"

    - name: Install the self-service survey
      ansible.builtin.uri:
        url: '{{ controller_api_base }}/workflow_job_templates/{{ workflow_saved.json.id }}/survey_spec/'
        method: POST
        headers: {Authorization: "Bearer {{ lookup('ansible.builtin.env', 'CONTROLLER_OAUTH_TOKEN') }}"}
        body_format: json
        body: '{{ effective_survey }}'
        status_code: [200, 201]
      no_log: true

    - name: Reconcile sequential workflow nodes
      ansible.builtin.include_tasks: tasks/controller-node.yml
      loop: '{{ controller_nodes }}'
      loop_control:
        loop_var: node_definition

    - name: Read the existing graph before linking
      ansible.builtin.uri:
        url: '{{ controller_api_base }}/workflow_job_templates/{{ workflow_saved.json.id }}/workflow_nodes/?page_size=100'
        headers: {Authorization: "Bearer {{ lookup('ansible.builtin.env', 'CONTROLLER_OAUTH_TOKEN') }}"}
      register: workflow_nodes
      no_log: true

    - name: Reject unexpected nodes rather than silently altering another workflow
      ansible.builtin.assert:
        that:
          - workflow_nodes.json.count | int == 3
          - workflow_nodes.json.results | map(attribute='identifier') | sort == ['execute', 'plan', 'preflight']

    - name: Link success-only edges
      ansible.builtin.include_tasks: tasks/controller-edge.yml
      loop:
        - {source: preflight, target: plan}
        - {source: plan, target: execute}
      loop_control:
        loop_var: graph_edge


    - name: Read the final graph
      ansible.builtin.uri:
        url: '{{ controller_api_base }}/workflow_job_templates/{{ workflow_saved.json.id }}/workflow_nodes/?page_size=100'
        headers: {Authorization: "Bearer {{ lookup('ansible.builtin.env', 'CONTROLLER_OAUTH_TOKEN') }}"}
      register: final_graph
      no_log: true

    - name: Reject unexpected failure, always, or success paths
      ansible.builtin.assert:
        that:
          - item.failure_nodes | length == 0
          - item.always_nodes | length == 0
          - item.success_nodes | sort == expected_success | sort
        fail_msg: Existing workflow graph differs from the reviewed sequence; review its links manually.
      vars:
        next_identifier: "{{ {'preflight': 'plan', 'plan': 'execute', 'execute': ''}[item.identifier] }}"
        expected_success: "{{ (final_graph.json.results | selectattr('identifier', 'equalto', next_identifier) | map(attribute='id') | list) if next_identifier else [] }}"
      loop: '{{ final_graph.json.results }}'
      loop_control:
        label: '{{ item.identifier }}'

    - name: Report configuration without launching the workflow
      ansible.builtin.debug:
        msg: '{{ workflow_name }} and its survey are configured. Review execute RBAC and credentials before launch. The Git profile still controls deployment enablement.'
